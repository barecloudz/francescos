[build]
  command = "npm ci --production=false --audit=false --fund=false && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SUPABASE_URL = "https://gpvtdfljxucabjqokgdg.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwdnRkZmxqeHVjYWJqcW9rZ2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NDM1ODUsImV4cCI6MjA4MzExOTU4NX0.S5I02lv6s3AI-rWpFrEgUTX6-WbIeZ--llxDkILiB4U"
  NPM_CONFIG_FUND = "false"
  NPM_CONFIG_AUDIT = "false"
  DISABLE_OPENCOLLECTIVE = "true"
  SECRETS_SCAN_ENABLED = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NETLIFY_USE_YARN = "false"
  NODE_ENV = "production"
  NPM_CONFIG_PREFER_OFFLINE = "true"
  NPM_CONFIG_NO_PROGRESS = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Old domain redirect
[[redirects]]
  from = "https://francescosmyrtlebeach.com/*"
